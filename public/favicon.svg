<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="agroGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="rgba(255,255,255,0.1)" stroke-width="8" />
  
  <!-- AgroSync Interlocking Leaves Symbol -->
  <g filter="url(#glow)" transform="translate(64, 64) scale(0.75)">
    <!-- Left Leaf (Growth / Agro) -->
    <path d="M120 380 C80 320, 60 220, 150 140 C220 78, 270 120, 260 210 C250 300, 160 380, 120 380 Z" 
          fill="none" 
          stroke="url(#agroGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Center stem vein Left -->
    <path d="M125 365 C170 280, 210 200, 245 155" 
          stroke="url(#agroGradient)" 
          stroke-width="20" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Right Leaf (Sync / Tech) -->
    <path d="M392 132 C432 192, 452 292, 362 372 C292 434, 242 392, 252 302 C262 212, 352 132, 392 132 Z" 
          fill="none" 
          stroke="url(#agroGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Center stem vein Right -->
    <path d="M387 147 C342 232, 302 312, 267 357" 
          stroke="url(#agroGradient)" 
          stroke-width="20" 
          stroke-linecap="round" 
          opacity="0.85" />
  </g>
</svg>